<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <title>中传海南一站通</title>
  <style>
    :root{
      color-scheme:light;
      --ink:#1d1d1f;--muted:#6e6e73;--faint:#8e8e93;--canvas:#f5f5f7;
      --surface:#fff;--surface-soft:rgba(255,255,255,.72);--line:rgba(60,60,67,.14);
      --blue:#007aff;--blue-deep:#0062cc;--blue-soft:#eaf4ff;--teal:#16a085;
      --green:#248a3d;--green-soft:#eaf7ed;--amber:#a35d00;--amber-soft:#fff4df;
      --red:#d70015;--shadow:0 24px 70px rgba(0,0,0,.14);--card-shadow:0 1px 2px rgba(0,0,0,.03),0 8px 26px rgba(0,0,0,.045);
      --spring:cubic-bezier(.2,.8,.2,1);--focus:0 0 0 4px rgba(0,122,255,.18);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
    body{margin:0;min-height:100dvh;color:var(--ink);background:var(--canvas);font:400 15px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit;-webkit-tap-highlight-color:transparent}
    button{cursor:pointer;touch-action:manipulation}
    a{color:inherit}
    :focus-visible{outline:0;box-shadow:var(--focus)}
    .site-header{position:sticky;top:0;z-index:20;background:rgba(245,245,247,.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
    .site-header:after{content:"";position:absolute;inset:auto 0 -12px;height:12px;background:linear-gradient(rgba(245,245,247,.45),transparent);pointer-events:none}
    .header-inner{max-width:1160px;margin:auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .mark{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;color:#fff;background:linear-gradient(145deg,#39a7ff 0%,#087df2 52%,#5556d6 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px rgba(0,122,255,.2);font:700 17px/1 "Songti SC",serif}
    .brand-copy{min-width:0}.brand-title{font-weight:650;font-size:15px;letter-spacing:-.015em;white-space:nowrap}.brand-subtitle{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ask-top{min-height:38px;border:0;border-radius:999px;padding:8px 13px;background:var(--blue);color:#fff;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 4px 12px rgba(0,122,255,.18);transition:transform 100ms ease-out,background 160ms ease}
    .ask-top svg{width:16px;height:16px}.ask-top:active{transform:scale(.96)}
    main{max-width:1160px;margin:auto;padding:20px 16px 120px}
    .hero{min-height:330px;border-radius:30px;overflow:hidden;background:linear-gradient(145deg,#fff 0%,#f7fbff 48%,#edf6ff 100%);padding:30px 24px;position:relative;isolation:isolate;box-shadow:var(--card-shadow)}
    .hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);z-index:-1;pointer-events:none}
    .hero:before{width:280px;height:280px;right:-90px;top:-110px;background:radial-gradient(circle at 35% 35%,rgba(112,206,255,.42),rgba(0,122,255,.08) 58%,transparent 70%)}
    .hero:after{width:230px;height:230px;right:70px;bottom:-160px;background:radial-gradient(circle,rgba(175,82,222,.13),transparent 68%)}
    .hero-content{position:relative;z-index:1;max-width:760px}
    .eyebrow{display:inline-flex;align-items:center;gap:7px;color:var(--blue);font-size:12px;font-weight:650;letter-spacing:.035em}
    .eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 0 4px rgba(48,209,88,.12)}
    h1{max-width:760px;margin:14px 0 12px;font-size:clamp(32px,8.4vw,58px);font-weight:700;line-height:1.04;letter-spacing:-.045em;text-wrap:balance}
    .hero p{max-width:650px;margin:0;color:var(--muted);font-size:clamp(15px,2.4vw,18px);line-height:1.55;letter-spacing:-.008em}
    .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}.stat{padding:7px 11px;border:1px solid rgba(255,255,255,.72);border-radius:999px;background:rgba(255,255,255,.58);backdrop-filter:blur(14px) saturate(160%);-webkit-backdrop-filter:blur(14px) saturate(160%);font-size:12px;color:var(--muted);box-shadow:0 3px 12px rgba(0,0,0,.035)}.stat strong{color:var(--ink);font-weight:650}
    .notice{width:fit-content;max-width:100%;margin:14px 4px 0;padding:7px 10px;color:var(--muted);font-size:11px;display:flex;gap:7px;align-items:flex-start;border-radius:12px;background:rgba(255,255,255,.5)}.notice svg{width:14px;flex:0 0 auto;margin-top:1px;color:var(--amber)}
    .workspace{margin-top:30px}
    .controls{display:grid;gap:12px}
    .tabs{display:grid;grid-template-columns:1fr 1fr;padding:3px;background:rgba(118,118,128,.12);border-radius:11px}
    .tab{min-height:38px;border:0;background:transparent;color:var(--muted);border-radius:9px;padding:8px 10px;font-weight:550;transition:transform 100ms ease-out,color 160ms ease,background 160ms ease}.tab:active{transform:scale(.98)}.tab.active{background:rgba(255,255,255,.94);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
    .search{position:relative}.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;color:var(--faint);pointer-events:none}
    .search input{width:100%;height:46px;padding:0 42px;border:1px solid transparent;border-radius:14px;background:rgba(118,118,128,.1);outline:none;color:var(--ink);font-size:16px;transition:background 160ms ease,box-shadow 160ms ease}.search input::placeholder{color:var(--faint)}.search input:focus{background:#fff;box-shadow:var(--focus)}
    .clear-search{display:none;position:absolute;right:7px;top:6px;width:34px;height:34px;border:0;background:transparent;color:var(--faint);border-radius:50%}.clear-search:active{background:rgba(118,118,128,.12)}
    .tags{display:flex;gap:7px;overflow:auto;padding:1px 1px 7px;scrollbar-width:none;scroll-snap-type:x proximity}.tags::-webkit-scrollbar{display:none}
    .tag{flex:0 0 auto;min-height:34px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.78);color:var(--muted);padding:6px 12px;font-size:12px;scroll-snap-align:start;transition:transform 100ms ease-out,background 160ms ease,color 160ms ease}.tag:active{transform:scale(.96)}.tag.active{border-color:transparent;background:var(--ink);color:#fff;font-weight:600}
    .section-head{display:flex;align-items:end;justify-content:space-between;margin:28px 2px 12px}.section-head h2{margin:0;font-size:21px;line-height:1.2;font-weight:700;letter-spacing:-.025em}.result-count{color:var(--muted);font-size:12px}
    .resource-grid{display:grid;gap:10px}
    .resource{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;text-decoration:none;padding:14px;border:1px solid rgba(60,60,67,.08);border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 1px 2px rgba(0,0,0,.025);transition:transform 130ms ease-out,box-shadow 220ms ease,border-color 220ms ease;min-width:0}
    .resource:active{transform:scale(.985);background:#f9f9fb}.resource.pinned{border-color:rgba(255,159,10,.22);background:linear-gradient(110deg,#fffaf1,#fff 58%)}
    .file-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:11px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;background:#e8f5ee;color:#248a3d;box-shadow:inset 0 0 0 1px rgba(0,0,0,.025)}
    .file-icon.pdf{background:#fff0ef;color:#d33b32}.file-icon.word{background:#eaf3ff;color:#1473e6}.file-icon.excel{background:#eaf7ed;color:#248a3d}.file-icon.image{background:#fff6e5;color:#a35d00}.file-icon.link{background:#f2ecff;color:#7948bd}
    .resource-info{min-width:0}.resource-title{font-weight:600;line-height:1.4;letter-spacing:-.01em;word-break:break-word}.pin{color:var(--amber);font-size:10px;margin-left:6px;white-space:nowrap}.resource-desc{margin-top:3px;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.resource-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;color:var(--faint);font-size:10px}.mini-tag{padding:1px 6px;background:rgba(118,118,128,.09);border-radius:999px;color:var(--muted)}
    .open-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--blue);background:var(--blue-soft)}.open-icon svg{width:15px}
    .qa-list{display:grid;gap:10px}.qa-group-title{margin:22px 2px 8px;color:var(--blue);font-size:13px;font-weight:650}.qa-item{border:1px solid rgba(60,60,67,.08);border-radius:18px;background:rgba(255,255,255,.92);overflow:hidden}.qa-item summary{list-style:none;padding:15px 46px 15px 16px;font-weight:600;line-height:1.45;cursor:pointer;position:relative}.qa-item summary::-webkit-details-marker{display:none}.qa-item summary:after{content:"＋";position:absolute;right:16px;top:13px;color:var(--blue);font-size:20px;font-weight:400;transition:transform 220ms var(--spring)}.qa-item[open] summary:after{content:"−";transform:rotate(180deg)}.qa-answer{border-top:1px solid var(--line);padding:14px 16px 17px;color:#3a3a3c;font-size:14px;white-space:pre-line}.qa-answer strong{color:var(--ink)}
    .empty{padding:56px 18px;text-align:center;color:var(--muted);border-radius:20px;background:rgba(255,255,255,.72)}.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}.loading{display:grid;place-items:center;padding:70px 0;color:var(--muted)}

    .chat-launcher{position:fixed;z-index:45;right:16px;bottom:max(16px,env(safe-area-inset-bottom));min-height:52px;border:1px solid rgba(255,255,255,.58);border-radius:999px;background:rgba(29,29,31,.9);backdrop-filter:blur(22px) saturate(170%);-webkit-backdrop-filter:blur(22px) saturate(170%);color:#fff;padding:8px 16px 8px 8px;box-shadow:0 14px 40px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.18);display:flex;align-items:center;gap:10px;font-weight:600;transition:transform 100ms ease-out,opacity 180ms ease}.chat-launcher svg{width:20px}.chat-launcher:before{content:"✦";width:36px;height:36px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(145deg,#4bb5ff,#0a84ff 55%,#5e5ce6);font-size:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.38)}.chat-launcher:active{transform:scale(.96)}.chat-launcher.hidden{opacity:0;visibility:hidden;pointer-events:none}
    .chat-backdrop{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity 180ms ease,visibility 180ms}.chat-backdrop.show{opacity:1;visibility:visible}
    .chat-panel{position:fixed;z-index:50;left:0;right:0;bottom:0;height:min(88dvh,760px);display:grid;grid-template-rows:auto 1fr auto;background:rgba(248,248,250,.9);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.68);border-bottom:0;border-radius:28px 28px 0 0;box-shadow:0 -24px 70px rgba(0,0,0,.2);transform:translate3d(0,105%,0);overflow:hidden;padding-bottom:env(safe-area-inset-bottom);will-change:transform;visibility:hidden}.chat-panel.open{visibility:visible}
    .chat-head{min-height:68px;padding:14px 12px 11px 16px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.72);touch-action:none;user-select:none;cursor:grab}.chat-head:active{cursor:grabbing}
    .bot-avatar{width:40px;height:40px;display:grid;place-items:center;border-radius:13px;color:#fff;background:linear-gradient(145deg,#4bb5ff,#0a84ff 52%,#5e5ce6);font-size:16px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 5px 15px rgba(0,122,255,.2)}.chat-title{flex:1;min-width:0}.chat-title strong{display:block;font-weight:650;letter-spacing:-.015em}.chat-status{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-dot{width:6px;height:6px;border-radius:50%;background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.12)}
    .icon-btn{width:36px;height:36px;border:0;border-radius:50%;background:rgba(118,118,128,.1);color:var(--muted);display:grid;place-items:center;transition:transform 100ms ease-out,background 160ms ease}.icon-btn:active{transform:scale(.92);background:rgba(118,118,128,.18)}.icon-btn svg{width:17px}.drag-handle{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:5px;border-radius:9px;background:rgba(60,60,67,.22)}
    .chat-messages{padding:18px 14px 24px;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(rgba(255,255,255,.38),rgba(245,245,247,.76));display:flex;flex-direction:column;gap:13px;scrollbar-width:thin}
    .chat-message{max-width:92%;border-radius:20px;padding:11px 14px;box-shadow:0 5px 18px rgba(0,0,0,.04)}.chat-message.user{align-self:flex-end;color:#fff;background:var(--blue);border-bottom-right-radius:6px;white-space:pre-wrap}.chat-message.assistant{align-self:flex-start;border:1px solid rgba(60,60,67,.08);background:rgba(255,255,255,.94);border-bottom-left-radius:6px}.assistant-answer{white-space:pre-wrap}.message-label{color:var(--muted);font-size:10px;margin-bottom:4px;font-weight:600}.user .message-label{color:rgba(255,255,255,.72)}
    .suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.suggestion{min-height:32px;border:0;border-radius:999px;background:var(--blue-soft);color:var(--blue-deep);padding:7px 10px;font-size:11px;font-weight:550;text-align:left;transition:transform 100ms ease-out}.suggestion:active{transform:scale(.96)}
    .answer-note{margin-top:10px;padding:9px 10px;background:var(--blue-soft);color:#174b7e;font-size:11px;border-radius:10px}.answer-note.warn{background:var(--amber-soft);color:#714100}.answer-note.handoff{background:var(--green-soft);color:#236132}.answer-note strong{font-weight:650}
    .sources{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}.sources>summary{cursor:pointer;color:var(--blue);font-size:12px;font-weight:600}.source{margin-top:8px;padding:10px;border-radius:12px;background:rgba(118,118,128,.075)}.source-title{font-size:11px;font-weight:600}.source-meta{color:var(--muted);font-size:10px;margin-top:3px}.source a{display:inline-block;margin-top:5px;color:var(--blue);font-size:10px;text-decoration:none}
    .typing{display:inline-flex;gap:4px;align-items:center}.typing i{width:5px;height:5px;border-radius:50%;background:#8e8e93;animation:pulse 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes pulse{0%,70%,100%{opacity:.28;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
    .chat-compose{padding:10px 12px 11px;background:rgba(255,255,255,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}.compose-box{display:grid;grid-template-columns:1fr 40px;gap:7px;align-items:end;border:1px solid rgba(60,60,67,.12);border-radius:18px;padding:6px;background:rgba(255,255,255,.94);transition:box-shadow 160ms ease}.compose-box:focus-within{box-shadow:var(--focus)}textarea{width:100%;min-height:38px;max-height:110px;resize:none;border:0;outline:0;background:transparent;padding:8px;font-size:16px;line-height:1.4;color:var(--ink)}.send{width:40px;height:40px;border:0;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;transition:transform 100ms ease-out,opacity 160ms ease}.send:active{transform:scale(.9)}.send:disabled{opacity:.4}.send svg{width:18px}.privacy{margin-top:6px;text-align:center;color:var(--faint);font-size:9px}

    @media(min-width:720px){
      .header-inner{padding:12px 24px}.brand-title{font-size:16px}.brand-subtitle{font-size:12px}
      main{padding:34px 24px 140px}.hero{min-height:380px;padding:52px 48px;display:flex;align-items:center}.controls{grid-template-columns:280px 1fr;align-items:center}.tags{grid-column:1/-1}.resource-grid{grid-template-columns:1fr 1fr}.resource{padding:16px}
      .chat-backdrop{display:none}.chat-panel{left:auto;right:24px;bottom:24px;width:420px;height:min(720px,calc(100dvh - 48px));border-radius:26px;border-bottom:1px solid rgba(255,255,255,.68);box-shadow:var(--shadow);transform:translate3d(0,28px,0) scale(.97);transform-origin:bottom right;opacity:0;visibility:hidden;transition:transform .32s var(--spring),opacity .2s ease,visibility .32s}.chat-panel.open{transform:none;opacity:1;visibility:visible}.drag-handle{display:none}.chat-head{touch-action:auto;cursor:default}.chat-launcher{right:24px;bottom:24px}
    }
    @media(hover:hover){.resource:hover{transform:translateY(-3px);border-color:rgba(0,122,255,.16);box-shadow:0 14px 34px rgba(0,0,0,.07)}.tag:hover{background:#fff}.tag.active:hover{background:var(--ink)}.ask-top:hover,.send:hover{background:var(--blue-deep)}.suggestion:hover{background:#dceeff}.chat-launcher:hover{transform:translateY(-2px)}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:opacity 160ms ease!important}.chat-panel{transform:none!important}.chat-panel:not(.open){opacity:0!important}}
    @media(prefers-reduced-transparency:reduce){.site-header,.chat-launcher,.chat-panel,.chat-compose,.stats .stat{backdrop-filter:none;-webkit-backdrop-filter:none}.site-header{background:#f5f5f7}.chat-panel{background:#f8f8fa}.chat-compose,.chat-head{background:#fff}}
    @media(prefers-contrast:more){:root{--line:rgba(0,0,0,.38)}.resource,.qa-item,.chat-message.assistant,.chat-panel{border-color:var(--line)}.tag.active{outline:2px solid #000}}
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand"><div class="mark">传</div><div class="brand-copy"><div class="brand-title">中传海南一站通</div><div class="brand-subtitle">学生共建 · 入学资料与经验</div></div></div>
      <button class="ask-top" data-open-chat aria-label="打开新生助手"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/></svg>问问助手</button>
    </div>
  </header>
  <main>
    <section class="hero">
      <div class="hero-content">
        <div class="eyebrow">学生共建资料库持续更新中</div>
        <h1>新生需要的，<br>都从这里开始。</h1>
        <p>查资料，翻经验，或者直接问 Copilot。它会先找知识库，再说明参考来源和还不能确定的地方。</p>
        <div class="stats" id="stats"><span class="stat">正在读取资料库…</span></div>
      </div>
    </section>
    <div class="notice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v5m0 3h.01"/></svg><span id="disclaimer">学生自建资料库，具体安排请以学校最新通知为准。</span></div>

    <section class="workspace">
      <div class="controls">
        <div class="tabs" role="tablist"><button class="tab active" id="resourcesTab" role="tab" aria-selected="true">资料与入口</button><button class="tab" id="questionsTab" role="tab" aria-selected="false">百问百答</button></div>
        <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="librarySearch" type="search" placeholder="搜索文件、标签或问题" autocomplete="off"><button class="clear-search" id="clearSearch" aria-label="清空搜索">×</button></div>
        <div class="tags" id="tags" aria-label="资料标签"></div>
      </div>
      <div class="section-head"><h2 id="sectionTitle">资料与常用入口</h2><span class="result-count" id="resultCount"></span></div>
      <div id="libraryContent" class="loading">资料正在整理中…</div>
    </section>
  </main>

  <button class="chat-launcher" id="chatLauncher" data-open-chat aria-label="打开新生助手">有问题？先问问我</button>
  <div class="chat-backdrop" id="chatBackdrop"></div>
  <aside class="chat-panel" id="chatPanel" role="dialog" aria-modal="true" aria-labelledby="chatHeading" aria-hidden="true">
    <div class="drag-handle"></div>
    <div class="chat-head" id="chatDragArea"><div class="bot-avatar">✦</div><div class="chat-title"><strong id="chatHeading">海南新生 Copilot</strong><div class="chat-status"><span class="status-dot"></span><span id="chatStatus">连接知识库中…</span></div></div><button class="icon-btn" id="resetChat" aria-label="开始新对话" title="新对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button><button class="icon-btn" id="closeChat" aria-label="关闭助手"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
    <div class="chat-messages" id="chatMessages" aria-live="polite"></div>
    <div class="chat-compose"><div class="compose-box"><textarea id="chatInput" rows="1" maxlength="500" placeholder="问问报到、宿舍、选课、保研…" aria-label="向新生助手提问"></textarea><button class="send" id="sendChat" aria-label="发送问题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div><div class="privacy">回答仅供参考；重要政策与个人事项请向老师或对应部门确认</div></div>
  </aside>

  <script>
    const $=s=>document.querySelector(s);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeUrl=u=>/^https?:\/\//i.test(u)||u.startsWith('/files/')?u:'#';
    const fmtSize=n=>n>=1024?`${(n/1024).toFixed(n>=10240?0:1)} MB`:`${Math.round(n)} KB`;
    const iconLabel={pdf:'PDF',word:'DOC',excel:'XLS',image:'IMG',link:'↗'};
    const authorityName={official_policy:'学校正式政策',official_guidance:'学校办事材料',official_web:'学校官网',public_web:'公开网络',peer_experience:'往届学生经验',unverified:'待核实资料'};
    let library={files:[],links:[],questions:[],tags:[],counts:{}};let activeTab='resources';let activeTag='';let sessionId=null;let busy=false;
    const mobileSheet=matchMedia('(max-width:719px)');const reducedMotion=matchMedia('(prefers-reduced-motion:reduce)');let sheetFrame=0;let sheetDrag=null;

    function boldText(text){return esc(text).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
    async function loadLibrary(){
      try{const r=await fetch('/api/library');if(!r.ok)throw new Error('library_failed');library=await r.json();$('#disclaimer').textContent=library.disclaimer;$('#stats').innerHTML=`<span class="stat"><strong>${library.counts.files}</strong> 份资料</span><span class="stat"><strong>${library.counts.links}</strong> 个常用入口</span><span class="stat"><strong>${library.counts.questions}</strong> 条学生问答</span>`;renderTags();renderLibrary()}
      catch(e){$('#libraryContent').innerHTML='<div class="empty"><strong>资料库暂时没有加载出来</strong>可以先问问右下角的 Copilot，或稍后刷新页面。</div>'}
    }
    function renderTags(){const shown=library.tags.slice(0,18);$('#tags').innerHTML=`<button class="tag active" data-tag="">全部</button>`+shown.map(t=>`<button class="tag" data-tag="${esc(t.name)}">${esc(t.name)} · ${t.count}</button>`).join('');$('#tags').querySelectorAll('.tag').forEach(b=>b.onclick=()=>{activeTag=b.dataset.tag;renderTags();renderLibrary()})}
    function resourceCard(item,isLink=false){const title=isLink?item.title:item.name;const description=item.description||'';const meta=isLink?'常用网站':`${fmtSize(item.size_kb)}${item.uploaded_at?` · ${esc(item.uploaded_at)}`:''}`;const type=isLink?'link':item.type;return `<a class="resource ${item.pinned?'pinned':''}" href="${esc(safeUrl(item.url))}" target="_blank" rel="noreferrer"><div class="file-icon ${esc(type)}">${iconLabel[type]||'FILE'}</div><div class="resource-info"><div class="resource-title">${esc(title)}${item.pinned?'<span class="pin">置顶</span>':''}</div><div class="resource-desc">${esc(description)}</div><div class="resource-meta"><span>${meta}</span>${(item.tags||[]).slice(0,3).map(t=>`<span class="mini-tag">${esc(t)}</span>`).join('')}</div></div><div class="open-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17 17 7M7 7h10v10"/></svg></div></a>`}
    function normalizedQuery(){return $('#librarySearch').value.trim().toLowerCase()}
    function includesItem(item,q){const blob=[item.name,item.title,item.description,...(item.tags||[])].filter(Boolean).join(' ').toLowerCase();return (!q||blob.includes(q))&&(!activeTag||(item.tags||[]).includes(activeTag))}
    function renderResources(q){const files=library.files.filter(x=>includesItem(x,q));const links=library.links.filter(x=>includesItem(x,q));const items=[...files.map(x=>resourceCard(x)),...links.map(x=>resourceCard(x,true))];$('#resultCount').textContent=`${items.length} 项`;$('#libraryContent').className='resource-grid';$('#libraryContent').innerHTML=items.length?items.join(''):'<div class="empty"><strong>没有找到这份资料</strong>换个关键词，或者直接问问 Copilot。</div>'}
    function renderQuestions(q){const filtered=library.questions.filter(x=>(!activeTag||x.category.includes(activeTag))&&(!q||(x.question+' '+x.answer+' '+x.category).toLowerCase().includes(q)));const groups={};filtered.forEach(x=>(groups[x.category]??=[]).push(x));let html='';for(const [category,items] of Object.entries(groups)){html+=`<div class="qa-group-title">${esc(category)}</div>`+items.map(x=>`<details class="qa-item"><summary>${esc(x.question)}</summary><div class="qa-answer">${boldText(x.answer)}</div></details>`).join('')}$('#resultCount').textContent=`${filtered.length} 个问题`;$('#libraryContent').className='qa-list';$('#libraryContent').innerHTML=html||'<div class="empty"><strong>没有找到对应问答</strong>这不代表没有答案，可以让 Copilot 帮你继续查。</div>'}
    function renderLibrary(){const q=normalizedQuery();$('#clearSearch').style.display=q?'block':'none';$('#sectionTitle').textContent=activeTab==='resources'?'资料与常用入口':'新生百问百答';activeTab==='resources'?renderResources(q):renderQuestions(q)}
    function setTab(tab){activeTab=tab;$('#resourcesTab').classList.toggle('active',tab==='resources');$('#questionsTab').classList.toggle('active',tab==='questions');$('#resourcesTab').setAttribute('aria-selected',tab==='resources');$('#questionsTab').setAttribute('aria-selected',tab==='questions');renderLibrary()}

    function welcome(){return `<div class="chat-message assistant"><div class="message-label">海南新生 Copilot</div><div class="assistant-answer">嗨，有什么问题先问我吧。\n\n我会先查资料库。需要参考网页、资料之间有冲突，或者暂时不能确定时，我都会直接告诉你，再建议你找谁确认。</div><div class="suggestions"><button class="suggestion">开学报到要带什么？</button><button class="suggestion">宿舍是几人间？</button><button class="suggestion">有保研机会吗？</button></div></div>`}
    function bindSuggestions(){document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{$('#chatInput').value=b.textContent;ask()})}
    function sheetY(){const t=getComputedStyle($('#chatPanel')).transform;if(!t||t==='none')return 0;const values=t.match(/matrix(?:3d)?\((.+)\)/)?.[1].split(',').map(Number)||[];return values.length===16?values[13]:(values[5]||0)}
    function setSheetY(y){const panel=$('#chatPanel');panel.style.transform=`translate3d(0,${y}px,0)`;const progress=1-Math.min(1,Math.max(0,y)/(panel.offsetHeight*.82));$('#chatBackdrop').style.opacity=String(progress)}
    function animateSheet(target,initialVelocity=0,done=()=>{}){cancelAnimationFrame(sheetFrame);const panel=$('#chatPanel');let x=sheetY();let v=initialVelocity;let last=performance.now();if(reducedMotion.matches){setSheetY(target);done();return}const step=now=>{const dt=Math.min((now-last)/1000,.032);last=now;const force=-430*(x-target)-42*v;v+=force*dt;x+=v*dt;setSheetY(x);if(Math.abs(x-target)<.5&&Math.abs(v)<8){setSheetY(target);done();return}sheetFrame=requestAnimationFrame(step)};sheetFrame=requestAnimationFrame(step)}
    function finishClose(){const panel=$('#chatPanel');const returnFocus=panel.contains(document.activeElement);panel.classList.remove('open');panel.setAttribute('aria-hidden','true');panel.style.transform='';$('#chatBackdrop').classList.remove('show');$('#chatBackdrop').style.opacity='';$('#chatLauncher').classList.remove('hidden');document.body.style.overflow='';if(returnFocus)$('#chatLauncher').focus()}
    function openChat(){const panel=$('#chatPanel');if(panel.classList.contains('open'))return;panel.classList.add('open');panel.setAttribute('aria-hidden','false');panel.setAttribute('aria-modal',mobileSheet.matches?'true':'false');$('#chatBackdrop').classList.add('show');$('#chatLauncher').classList.add('hidden');if(mobileSheet.matches){document.body.style.overflow='hidden';setSheetY(panel.offsetHeight+24);animateSheet(0)}else{panel.style.transform='';$('#chatBackdrop').style.opacity=''}setTimeout(()=>$('#chatInput').focus(),reducedMotion.matches?0:320)}
    function closeChat(initialVelocity=0){const panel=$('#chatPanel');if(!panel.classList.contains('open'))return;if(mobileSheet.matches)animateSheet(panel.offsetHeight+24,Math.max(0,initialVelocity),finishClose);else finishClose()}
    function rubberband(distance,dimension,constant=.4){return(distance*dimension*constant)/(dimension+constant*Math.abs(distance))}
    function project(velocity,deceleration=.99){return(velocity/1000)*deceleration/(1-deceleration)}
    function startSheetDrag(e){if(!mobileSheet.matches||!$('#chatPanel').classList.contains('open')||e.target.closest('button'))return;cancelAnimationFrame(sheetFrame);e.currentTarget.setPointerCapture(e.pointerId);sheetDrag={id:e.pointerId,startPointer:e.clientY,startSheet:sheetY(),history:[{y:e.clientY,t:performance.now()}]}}
    function moveSheetDrag(e){if(!sheetDrag||e.pointerId!==sheetDrag.id)return;const raw=sheetDrag.startSheet+e.clientY-sheetDrag.startPointer;const y=raw<0?rubberband(raw,$('#chatPanel').offsetHeight):raw;setSheetY(y);const now=performance.now();sheetDrag.history.push({y:e.clientY,t:now});sheetDrag.history=sheetDrag.history.filter(p=>now-p.t<90)}
    function endSheetDrag(e){if(!sheetDrag||e.pointerId!==sheetDrag.id)return;const history=sheetDrag.history;const first=history[0]||{y:e.clientY,t:performance.now()};const elapsed=Math.max(16,performance.now()-first.t);const velocity=(e.clientY-first.y)/elapsed*1000;const current=sheetY();const projected=current+project(velocity);sheetDrag=null;if(projected>$('#chatPanel').offsetHeight*.3||velocity>700)closeChat(velocity);else animateSheet(0,velocity)}
    async function health(){try{const d=await fetch('/api/health').then(r=>r.json());const model=d.composer?.mode==='model'?'大模型已连接':'安全回答模式';const web=d.composer?.web_retrieval?.mode==='registry_plus_discovery'?' · 网页搜索已启用':'';$('#chatStatus').textContent=`${model}${web}`;}catch(e){$('#chatStatus').textContent='知识库连接待恢复'}}
    function addUser(q){$('#chatMessages').insertAdjacentHTML('beforeend',`<div class="chat-message user"><div class="message-label">你</div>${esc(q)}</div>`);scrollChat()}
    function typing(show){$('#typing')?.remove();if(show){$('#chatMessages').insertAdjacentHTML('beforeend','<div class="chat-message assistant" id="typing"><span class="typing"><i></i><i></i><i></i></span></div>');scrollChat()}}
    function sourceCard(x){const origin=x.retrieval_origin==='autonomous_search'?' · 本轮网页搜索':x.retrieval_origin==='verified_web_snapshot'?' · 已核验网页快照':x.retrieval_origin==='live_web'?' · 本轮读取':'';return `<div class="source"><div class="source-title">${esc(x.title)}</div><div class="source-meta">${esc(authorityName[x.authority_tier]||x.authority_tier||'参考资料')}${origin}${x.page_number?` · 第 ${x.page_number} 页`:''}</div><a href="${esc(safeUrl(x.source_url||'#'))}" target="_blank" rel="noreferrer">查看原始来源 ↗</a></div>`}
    function addAssistant(d){typing(false);const provenance=d.provenance?.notice?`<div class="answer-note"><strong>这段回答从哪里来</strong><br>${esc(d.provenance.notice)}</div>`:'';const unresolved=d.unresolved?.length?`<div class="answer-note warn"><strong>还不能完全确定</strong><br>${d.unresolved.map(esc).join('<br>')}</div>`:'';const handoff=d.human_handoff?`<div class="answer-note handoff"><strong>建议再确认一下</strong><br>${esc(d.human_handoff)}</div>`:'';const sources=d.sources||d.evidence||[];const evidence=sources.length?`<details class="sources"><summary>参考来源（${sources.length}）</summary>${sources.map(sourceCard).join('')}</details>`:'';$('#chatMessages').insertAdjacentHTML('beforeend',`<div class="chat-message assistant"><div class="message-label">海南新生 Copilot</div><div class="assistant-answer">${esc(d.display_answer||d.answer||'这次没有生成有效回答。')}</div>${provenance}${unresolved}${handoff}${evidence}</div>`);scrollChat()}
    function scrollChat(){const box=$('#chatMessages');requestAnimationFrame(()=>box.scrollTo({top:box.scrollHeight,behavior:reducedMotion.matches?'auto':'smooth'}))}
    async function ask(){const input=$('#chatInput');const q=input.value.trim();if(!q||busy)return;busy=true;input.value='';input.style.height='auto';$('#sendChat').disabled=true;addUser(q);typing(true);try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q,session_id:sessionId,profile:{cohort:'2026',student_level:'undergraduate'}})});const d=await r.json();if(!r.ok)throw new Error(d.error||'request_failed');sessionId=d.session_id;addAssistant(d)}catch(e){addAssistant({answer:'刚刚没有连上回答服务。你可以稍后再试，重要问题也可以先问师哥师姐或老师。',provenance:{notice:'本次请求失败，没有使用资料库或网页内容。'}})}finally{busy=false;$('#sendChat').disabled=false;input.focus()}}
    async function resetChat(){if(sessionId)await fetch('/api/session/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:sessionId})}).catch(()=>{});sessionId=null;$('#chatMessages').innerHTML=welcome();bindSuggestions();$('#chatInput').focus()}

    $('#resourcesTab').onclick=()=>setTab('resources');$('#questionsTab').onclick=()=>setTab('questions');$('#librarySearch').oninput=renderLibrary;$('#clearSearch').onclick=()=>{$('#librarySearch').value='';renderLibrary();$('#librarySearch').focus()};document.querySelectorAll('[data-open-chat]').forEach(b=>b.onclick=openChat);$('#closeChat').onclick=()=>closeChat();$('#chatBackdrop').onclick=()=>closeChat();$('#resetChat').onclick=resetChat;$('#sendChat').onclick=ask;$('#chatInput').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,110)+'px'};$('#chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};$('#chatDragArea').addEventListener('pointerdown',startSheetDrag);$('#chatDragArea').addEventListener('pointermove',moveSheetDrag);$('#chatDragArea').addEventListener('pointerup',endSheetDrag);$('#chatDragArea').addEventListener('pointercancel',endSheetDrag);mobileSheet.addEventListener('change',()=>{cancelAnimationFrame(sheetFrame);sheetDrag=null;$('#chatPanel').style.transform='';$('#chatBackdrop').style.opacity='';document.body.style.overflow=mobileSheet.matches&&$('#chatPanel').classList.contains('open')?'hidden':''});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#chatPanel').classList.contains('open'))closeChat()});
    $('#chatMessages').innerHTML=welcome();bindSuggestions();loadLibrary();health();setTimeout(openChat,700);
  </script>
</body>
</html>

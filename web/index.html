<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新生入学 Copilot</title>
  <style>
    :root{--ink:#13211b;--muted:#647069;--paper:#f5f4ed;--card:#fffdf8;--line:#d8ded7;--green:#1c6b4a;--soft:#e9f1eb;--amber:#9b6513;--red:#a43e35}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(145deg,#eef4ec,#f8f1e7);font:15px/1.65 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}
    header{padding:30px max(20px,calc((100vw - 980px)/2));border-bottom:1px solid var(--line);background:rgba(255,253,248,.78);backdrop-filter:blur(14px);position:sticky;top:0;z-index:2}
    .head{display:flex;justify-content:space-between;gap:18px;align-items:center}.brand h1{margin:0;font:700 clamp(25px,4vw,40px)/1.15 ui-serif,"Songti SC",serif;letter-spacing:-.035em}.brand p{margin:7px 0 0;color:var(--muted)}
    button{border:0;border-radius:12px;padding:11px 18px;color:white;background:var(--green);font-weight:700;cursor:pointer}.secondary{color:var(--green);background:var(--soft);white-space:nowrap}
    main{max-width:980px;margin:0 auto;padding:28px 20px 130px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.65);color:var(--muted);font-size:12px}
    #messages{display:grid;gap:18px}.message{max-width:86%;padding:16px 18px;border-radius:18px;box-shadow:0 10px 35px rgba(55,64,48,.05)}.user{justify-self:end;background:var(--green);color:white;border-bottom-right-radius:5px}.assistant{justify-self:start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}.answer{white-space:pre-wrap}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}.user .label{color:#cce2d5}
    .unresolved{margin:13px 0 0;padding:10px 12px;border-left:3px solid var(--amber);background:#fff6e7;color:#6d4b16;font-size:13px}.evidence{margin-top:14px}.evidence details{border-top:1px solid var(--line);padding:10px 0 0}.evidence summary{cursor:pointer;color:var(--green);font-weight:650}.source{margin:10px 0;padding:12px;border-radius:11px;background:#f3f4ee}.source p{margin:7px 0;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}.row{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:11px}.official_policy,.official_guidance{color:var(--green)}.peer_experience{color:var(--amber)}.unverified{color:var(--red)}a{color:var(--green)}
    .empty{text-align:center;color:var(--muted);padding:70px 15px}.composer{font-size:11px;color:var(--muted);margin-top:10px}.warning{color:var(--amber)}
    .dock{position:fixed;left:0;right:0;bottom:0;padding:16px 20px 22px;background:linear-gradient(transparent,rgba(245,244,237,.96) 22%);z-index:3}.inputbar{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 55px rgba(55,64,48,.16)}input{border:0;outline:0;background:transparent;font:inherit;font-size:16px;padding:8px 10px;min-width:0}
    @media(max-width:620px){header{position:static}.head{align-items:flex-start}.brand p{font-size:13px}.message{max-width:95%}.inputbar{grid-template-columns:1fr}.inputbar button{height:44px}}
  </style>
</head>
<body>
  <header><div class="head"><div class="brand"><h1>新生入学 Copilot</h1><p>依据现有资料回答，并明确区分学校材料、学生经验与待核实信息。</p></div><button class="secondary" id="reset">新对话</button></div></header>
  <main>
    <div class="meta" id="meta"><span class="pill">正在连接知识库…</span></div>
    <section id="messages"><div class="empty">试着问：宿舍是几人间？然后追问“那研究生呢？”</div></section>
  </main>
  <div class="dock"><div class="inputbar"><input id="query" value="宿舍是几人间，能确定吗？" aria-label="向新生入学助手提问"><button id="go">发送</button></div></div>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const statusName={experience_only:'学生经验参考',supported:'学校材料支持',supported_with_context:'多来源支持',supported_freshness_unverified:'学校材料支持 · 时效待核实',mixed_sources_review_required:'多来源 · 需谨慎核对',insufficient_contextual_evidence:'没有匹配当前追问的证据',insufficient:'证据不足',insufficient_official_evidence:'缺少学校材料',unverified:'来源待核实',error:'请求失败'};
    const composerName={extractive_fallback:'本地可审计回答',openai_compatible:'大模型生成',none:'未生成'};
    let sessionId=null;let first=true;
    async function health(){const h=await fetch('/api/health').then(r=>r.json());const mode=h.composer?.mode==='model'?`模型 ${h.composer.model}`:'本地可审计降级回答';document.querySelector('#meta').innerHTML=`<span class="pill">AI 服务已就绪</span><span class="pill">${esc(mode)}</span><span class="pill">会话记忆：最近 4 轮</span>`}
    function addUser(q){if(first){document.querySelector('#messages').innerHTML='';first=false}document.querySelector('#messages').insertAdjacentHTML('beforeend',`<article class="message user"><div class="label">你</div>${esc(q)}</article>`)}
    function sourceCard(x){return `<div class="source"><div class="row"><strong>${esc(x.evidence_id)}</strong><span class="${esc(x.authority_tier)}">${esc(x.authority_tier)}</span><span>${esc(x.assertion_policy)}</span>${x.page_number?`<span>p.${x.page_number}</span>`:''}${x.effective_from?`<span>生效 ${esc(x.effective_from)}</span>`:`<span>生效时间待核实</span>`}</div><strong>${esc(x.title)}</strong><p>${esc(x.text)}</p><a href="${esc(x.source_url)}" target="_blank" rel="noreferrer">查看原始来源</a></div>`}
    function addAssistant(d){const unresolved=d.unresolved?.length?`<div class="unresolved"><strong>仍需确认</strong><br>${d.unresolved.map(esc).join('<br>')}</div>`:'';const sourceLabel=d.citations?.length?'查看本轮引用与候选证据':'查看未采用的检索候选（不作为答案依据）';const sources=d.evidence?.length?`<div class="evidence"><details><summary>${sourceLabel}（${d.evidence.length}）</summary>${d.evidence.map(sourceCard).join('')}</details></div>`:'';const warning=d.composer_warning?`<span class="warning"> · 已触发安全降级</span>`:'';document.querySelector('#messages').insertAdjacentHTML('beforeend',`<article class="message assistant"><div class="label">Copilot · ${esc(statusName[d.answerability]||d.answerability)}</div><div class="answer">${esc(d.answer)}</div>${unresolved}${sources}<div class="composer">回答方式：${esc(composerName[d.composer]||d.composer)} · 第 ${d.conversation_turns} 轮${warning}</div></article>`);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
    async function ask(){const input=document.querySelector('#query');const q=input.value.trim();if(!q)return;addUser(q);input.value='';document.querySelector('#go').disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q,session_id:sessionId,profile:{cohort:'2026',student_level:'undergraduate'}})});const d=await r.json();if(!r.ok)throw new Error(d.error||'request_failed');sessionId=d.session_id;addAssistant(d)}catch(e){addAssistant({answer:'请求失败，请稍后重试。',answerability:'error',composer:'none',evidence:[],unresolved:[]})}finally{document.querySelector('#go').disabled=false;input.focus()}}
    async function reset(){if(sessionId)await fetch('/api/session/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:sessionId})});sessionId=null;first=true;document.querySelector('#messages').innerHTML='<div class="empty">新对话已开始。历史对话不会继续参与追问理解。</div>';}
    document.querySelector('#go').addEventListener('click',ask);document.querySelector('#query').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});document.querySelector('#reset').addEventListener('click',reset);health();
  </script>
</body>
</html>

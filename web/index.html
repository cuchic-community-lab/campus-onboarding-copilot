<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>新生入学 Copilot</title>
  <style>
    :root{--ink:#13211b;--muted:#647069;--paper:#f5f4ed;--card:#fffdf8;--line:#d8ded7;--green:#1c6b4a;--soft:#e9f1eb;--amber:#9b6513;--red:#a43e35}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(145deg,#eef4ec,#f8f1e7);font:15px/1.65 ui-sans-serif,system-ui,-apple-system,"PingFang SC",sans-serif}
    header{padding:30px max(20px,calc((100vw - 980px)/2));border-bottom:1px solid var(--line);background:rgba(255,253,248,.78);backdrop-filter:blur(14px);position:sticky;top:0;z-index:2}
    .head{display:flex;justify-content:space-between;gap:18px;align-items:center}.brand h1{margin:0;font:700 clamp(25px,4vw,40px)/1.15 ui-serif,"Songti SC",serif;letter-spacing:-.035em}.brand p{margin:7px 0 0;color:var(--muted)}
    button{border:0;border-radius:12px;padding:11px 18px;color:white;background:var(--green);font-weight:700;cursor:pointer}.secondary{color:var(--green);background:var(--soft);white-space:nowrap}
    main{max-width:980px;margin:0 auto;padding:28px 20px 130px}.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:rgba(255,255,255,.65);color:var(--muted);font-size:12px}
    #messages{display:grid;gap:18px}.message{max-width:86%;padding:16px 18px;border-radius:18px;box-shadow:0 10px 35px rgba(55,64,48,.05)}.user{justify-self:end;background:var(--green);color:white;border-bottom-right-radius:5px}.assistant{justify-self:start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}.answer{white-space:pre-wrap}.label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}.user .label{color:#cce2d5}
    .unresolved,.provenance,.handoff{margin:13px 0 0;padding:10px 12px;border-left:3px solid var(--amber);background:#fff6e7;color:#6d4b16;font-size:13px}.provenance{border-left-color:#315b92;background:#eef5ff;color:#294d78}.handoff{border-left-color:var(--green);background:#eef7f1;color:#315a3d}.evidence{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}.evidence>details>summary{cursor:pointer;color:var(--green);font-weight:650}.source{margin:10px 0;padding:12px;border-radius:6px;background:#f3f4ee}.source>summary{cursor:pointer}.source p{margin:9px 0;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.row{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:11px}.official_policy,.official_guidance,.official_web{color:var(--green)}.peer_experience{color:var(--amber)}.public_web{color:#315b92}.unverified{color:var(--red)}a{color:var(--green)}
    .empty{text-align:center;color:var(--muted);padding:70px 15px}.composer{font-size:11px;color:var(--muted);margin-top:10px}.warning{color:var(--amber)}
    .dock{position:fixed;left:0;right:0;bottom:0;padding:16px 20px 22px;background:linear-gradient(transparent,rgba(245,244,237,.96) 22%);z-index:3}.inputbar{max-width:980px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 55px rgba(55,64,48,.16)}input{border:0;outline:0;background:transparent;font:inherit;font-size:16px;padding:8px 10px;min-width:0}
    @media(max-width:620px){header{position:static}.head{align-items:flex-start}.brand p{font-size:13px}.message{max-width:95%}.inputbar{grid-template-columns:1fr}.inputbar button{height:44px}}
  </style>
</head>
<body>
  <header><div class="head"><div class="brand"><h1>新生入学 Copilot</h1><p>像一位有来源意识的学生大使，先回答问题，再把参考依据交给你。</p></div><button class="secondary" id="reset">新对话</button></div></header>
  <main>
    <div class="meta" id="meta"><span class="pill">正在连接知识库…</span></div>
    <section id="messages"><div class="empty">试着问：开学报到要带些什么？我去哪里查看依据？</div></section>
  </main>
  <div class="dock"><div class="inputbar"><input id="query" value="宿舍是几人间，能确定吗？" aria-label="向新生入学助手提问"><button id="go">发送</button></div></div>
  <script>
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const statusName={experience_only:'来自往届学生经验',supported:'有学校材料支持',supported_with_context:'学校材料与学生经验互相补充',supported_freshness_unverified:'有学校材料支持 · 请留意时效',supported_with_unresolved_wording:'已确认颁发证书 · 字样仍需核实',supported_with_unresolved_exclusivity:'已确认专业存在 · 开设范围仍需核实',mixed_sources_review_required:'多来源参考 · 请留意差异',web_supported:'已查询学校官网',public_web_supported:'已查询公开网络',web_supported_mixed:'学校官网与公开资料互相补充',insufficient_contextual_evidence:'暂时没有匹配这次追问的资料',insufficient_relevance:'知识库没有相关答案',insufficient:'暂时没有足够资料',insufficient_official_evidence:'还需要查询学校最新发布',unverified:'来源还需核实',error:'请求失败'};
    const composerName={extractive_fallback:'本地可审计回答',openai_compatible:'大模型生成',none:'未生成'};
    const authorityName={official_policy:'学校正式政策',official_guidance:'学校办事材料',official_web:'学校官网',public_web:'公开网络',peer_experience:'往届学生经验',unverified:'待核实资料'};
    let sessionId=null;let first=true;
    async function health(){const [h,s]=await Promise.all([fetch('/api/health').then(r=>r.json()),fetch('/api/corpus/stats').then(r=>r.json())]);const mode=h.composer?.mode==='model'?`模型 ${h.composer.model}`:'本地可审计降级回答';const webMode=h.composer?.web_retrieval?.mode;const web=webMode==='registry_plus_discovery'?'自主网页搜索已开启':webMode==='registry_only'?'仅使用已登记网页':'网页检索未开启';document.querySelector('#meta').innerHTML=`<span class="pill">${s.documents} documents</span><span class="pill">${s.chunks} chunks</span><span class="pill">${esc(mode)}</span><span class="pill">${esc(web)}</span><span class="pill">会话记忆：最近 4 轮</span>`}
    function addUser(q){if(first){document.querySelector('#messages').innerHTML='';first=false}document.querySelector('#messages').insertAdjacentHTML('beforeend',`<article class="message user"><div class="label">你</div>${esc(q)}</article>`)}
    function sourceCard(x){const origin=x.retrieval_origin;const authority=origin==='autonomous_search'?`${authorityName[x.authority_tier]||x.authority_tier} · 自主搜索`:origin==='verified_web_snapshot'?`${authorityName[x.authority_tier]||x.authority_tier} · 已核验快照`:origin==='live_web'?`${authorityName[x.authority_tier]||x.authority_tier} · 实时读取`:(authorityName[x.authority_tier]||x.authority_tier);const time=origin==='autonomous_search'?'<span>本轮自主搜索</span>':origin==='verified_web_snapshot'?'<span>已核验网页快照</span>':x.fetched_at?'<span>本轮实时读取</span>':x.published_at?`<span>发布 ${esc(x.published_at)}</span>`:x.effective_from?`<span>生效 ${esc(x.effective_from)}</span>`:'<span>时间信息待核实</span>';return `<details class="source"><summary><strong>${esc(x.title)}</strong></summary><div class="row"><span class="${esc(x.authority_tier)}">${esc(authority)}</span>${x.page_number?`<span>第 ${x.page_number} 页</span>`:''}${time}</div><p>${esc(x.text)}</p><a href="${esc(x.source_url)}" target="_blank" rel="noreferrer">查看原始来源</a></details>`}
    function addAssistant(d){const provenance=d.provenance?.notice?`<div class="provenance"><strong>信息来源</strong><br>${esc(d.provenance.notice)}</div>`:'';const unresolved=d.unresolved?.length?`<div class="unresolved"><strong>需要留意</strong><br>${d.unresolved.map(esc).join('<br>')}</div>`:'';const handoff=d.human_handoff?`<div class="handoff"><strong>进一步确认</strong><br>${esc(d.human_handoff)}</div>`:'';const cited=d.sources||[];const sources=cited.length?`<div class="evidence"><details><summary>参考来源（${cited.length}）</summary>${cited.map(sourceCard).join('')}</details></div>`:'';const warning=d.composer_warning?`<span class="warning"> · 已自动切换安全回答</span>`:'';const discovery=d.provenance?.autonomous_search_executed?' · 已执行自主搜索':'';document.querySelector('#messages').insertAdjacentHTML('beforeend',`<article class="message assistant"><div class="label">学生大使 · ${esc(statusName[d.answerability]||d.answerability)}${discovery}</div><div class="answer">${esc(d.display_answer||d.answer)}</div>${provenance}${unresolved}${handoff}${sources}<div class="composer">第 ${d.conversation_turns} 轮${warning}</div></article>`);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
    async function ask(){const input=document.querySelector('#query');const q=input.value.trim();if(!q)return;addUser(q);input.value='';document.querySelector('#go').disabled=true;try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q,session_id:sessionId,profile:{cohort:'2026',student_level:'undergraduate'}})});const d=await r.json();if(!r.ok)throw new Error(d.error||'request_failed');sessionId=d.session_id;addAssistant(d)}catch(e){addAssistant({answer:'请求失败，请稍后重试。',answerability:'error',composer:'none',evidence:[],unresolved:[]})}finally{document.querySelector('#go').disabled=false;input.focus()}}
    async function reset(){if(sessionId)await fetch('/api/session/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:sessionId})});sessionId=null;first=true;document.querySelector('#messages').innerHTML='<div class="empty">新对话已开始。历史对话不会继续参与追问理解。</div>';}
    document.querySelector('#go').addEventListener('click',ask);document.querySelector('#query').addEventListener('keydown',e=>{if(e.key==='Enter')ask()});document.querySelector('#reset').addEventListener('click',reset);health();
  </script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>中传海南一站通</title>
  <script>if(location.protocol==='file:'){document.documentElement.style.visibility='hidden';location.replace('http://127.0.0.1:8767/')}</script>
  <style>
    :root{
      color-scheme:light;--ink:#1d1d1f;--muted:#6e6e73;--faint:#8e8e93;--canvas:#f7f8fa;
      --surface:#fff;--sidebar:#f1f2f4;--line:rgba(60,60,67,.13);--blue:#087df2;--blue-deep:#0067d7;
      --blue-soft:#e8f3ff;--green:#248a3d;--shadow:0 22px 70px rgba(0,0,0,.14);
      --focus:0 0 0 4px rgba(0,122,255,.18);--spring:cubic-bezier(.2,.8,.2,1);
    }
    *{box-sizing:border-box}
    html,body{height:100%;overflow:hidden;-webkit-text-size-adjust:100%}
    body{margin:0;color:var(--ink);background:var(--canvas);font:400 15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
    button,input,textarea{font:inherit;-webkit-tap-highlight-color:transparent}button{cursor:pointer;touch-action:manipulation}a{color:inherit}:focus-visible{outline:0;box-shadow:var(--focus)}
    .app-shell{height:100dvh;display:grid;grid-template-columns:290px minmax(0,1fr)}
    .sidebar{position:relative;z-index:40;min-width:0;height:100%;display:grid;grid-template-rows:auto auto 1fr auto;background:var(--sidebar);border-right:1px solid rgba(60,60,67,.08);overflow:hidden}
    .sidebar-head{display:flex;align-items:center;gap:10px;padding:20px 18px 12px;touch-action:none;user-select:none}
    .mark{width:36px;height:36px;display:grid;place-items:center;border-radius:11px;color:#fff;background:linear-gradient(145deg,#42b2ff,#087df2 52%,#5e5ce6);font:700 16px/1 "Songti SC",serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 7px 16px rgba(0,122,255,.18)}
    .brand{min-width:0;flex:1}.brand strong{display:block;font-size:15px;font-weight:650;letter-spacing:-.015em;white-space:nowrap}.brand span{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .icon-btn{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--muted);display:grid;place-items:center;transition:transform 100ms ease-out,background 160ms ease}.icon-btn:active{transform:scale(.92);background:rgba(118,118,128,.14)}.icon-btn svg{width:19px;height:19px}.close-drawer{display:none}
    .sidebar-actions{padding:5px 12px 12px}.new-chat{width:100%;min-height:44px;border:0;border-radius:13px;background:rgba(255,255,255,.78);color:var(--ink);padding:9px 12px;display:flex;align-items:center;gap:10px;font-weight:600;text-align:left;transition:transform 100ms ease-out,background 160ms ease}.new-chat:active{transform:scale(.98);background:#fff}.new-chat svg{width:18px;color:var(--blue)}
    .library-search{position:relative;margin-top:9px}.library-search svg{position:absolute;left:12px;top:50%;width:17px;transform:translateY(-50%);color:var(--faint);pointer-events:none}.library-search input{width:100%;height:40px;padding:0 36px;border:0;border-radius:12px;background:rgba(118,118,128,.1);outline:0;color:var(--ink);font-size:14px}.library-search input:focus{background:#fff;box-shadow:var(--focus)}.library-search input::placeholder{color:var(--faint)}
    .clear-search{display:none;position:absolute;right:4px;top:3px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--faint)}
    .library-scroll{min-height:0;overflow-y:auto;padding:4px 8px 18px;overscroll-behavior:contain;scrollbar-width:thin}.library-label{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 6px;color:var(--muted);font-size:11px;font-weight:650;letter-spacing:.02em}.library-count{font-weight:400}
    .library-list{display:grid;gap:2px}.library-item{min-width:0;min-height:44px;border:0;border-radius:11px;background:transparent;padding:8px 9px;color:var(--ink);display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;text-decoration:none;text-align:left;transition:background 140ms ease,transform 100ms ease-out}.library-item:active{transform:scale(.985)}
    .item-icon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:#e5e7eb;color:#60656d;font-size:8px;font-weight:750}.item-icon.pdf{background:#feeceb;color:#c7352e}.item-icon.word{background:#e8f2ff;color:#156ed0}.item-icon.excel{background:#e7f5eb;color:#248a3d}.item-icon.image{background:#fff2dc;color:#9a5a00}.item-icon.link{background:#eee9ff;color:#6848bd}.item-icon.qa{background:var(--blue-soft);color:var(--blue)}
    .item-copy{min-width:0}.item-title{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;font-weight:520}.item-meta{display:block;margin-top:1px;color:var(--faint);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty-library{padding:24px 12px;color:var(--muted);font-size:12px;text-align:center}
    .sidebar-foot{padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid rgba(60,60,67,.08);background:rgba(241,242,244,.92)}.library-status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.status-dot{width:7px;height:7px;border-radius:50%;background:#30d158;box-shadow:0 0 0 3px rgba(48,209,88,.11)}.disclaimer{margin-top:7px;color:var(--faint);font-size:9px;line-height:1.45}
    .drawer-backdrop{display:none}
    .workspace{position:relative;min-width:0;height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;background:radial-gradient(circle at 50% 52%,rgba(205,232,255,.72),rgba(247,248,250,0) 34%),var(--canvas)}
    .topbar{min-height:64px;padding:10px 18px;display:flex;align-items:center;gap:10px;position:relative;z-index:10}.menu-btn{display:none}.top-title{min-width:0;flex:1}.top-title strong{display:block;font-size:14px;font-weight:630;letter-spacing:-.01em}.top-title span{display:block;color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.top-reset{display:none;background:rgba(255,255,255,.62)}
    .chat-messages{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:30px max(24px,calc((100% - 820px)/2)) 42px;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin}
    .welcome{margin:auto;text-align:center;max-width:680px;padding:40px 20px 90px}.welcome-mark{width:54px;height:54px;margin:0 auto 20px;display:grid;place-items:center;color:#fff;border-radius:18px;background:linear-gradient(145deg,#5bc0ff,#087df2 52%,#7d5ce7);font-size:23px;box-shadow:0 14px 34px rgba(0,122,255,.18),inset 0 1px 0 rgba(255,255,255,.42)}.welcome h1{margin:0;font-size:clamp(32px,4.3vw,52px);line-height:1.08;font-weight:570;letter-spacing:-.045em}.welcome p{max-width:530px;margin:16px auto 0;color:var(--muted);font-size:15px}.suggestions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:22px}.suggestion{min-height:38px;border:1px solid rgba(60,60,67,.08);border-radius:999px;background:rgba(255,255,255,.7);color:#3a3a3c;padding:8px 13px;font-size:12px;transition:transform 100ms ease-out,background 160ms ease}.suggestion:active{transform:scale(.96)}
    .chat-message{width:100%;max-width:760px;margin-inline:auto}.chat-message.user{display:flex;justify-content:flex-end}.user-bubble{max-width:78%;padding:10px 15px;border-radius:20px 20px 6px 20px;color:#fff;background:var(--blue);white-space:pre-wrap;box-shadow:0 7px 20px rgba(0,122,255,.13)}.chat-message.assistant{padding:2px 4px}.message-label{margin-bottom:6px;color:var(--muted);font-size:10px;font-weight:650}.assistant-answer{font-size:15px;line-height:1.72;white-space:pre-wrap}.assistant-progress{width:100%;max-width:760px;margin-inline:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.progress-spinner{width:14px;height:14px;border:2px solid rgba(0,122,255,.15);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .sources{margin-top:15px;border-top:1px solid var(--line);padding-top:10px}.sources>summary{width:fit-content;cursor:pointer;color:var(--blue-deep);font-size:12px;font-weight:600}.source{margin-top:8px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.68)}.source-title{font-size:11px;font-weight:600}.source-meta{margin-top:2px;color:var(--muted);font-size:10px}.source a{display:inline-block;margin-top:4px;color:var(--blue);font-size:10px;text-decoration:none}
    .composer-wrap{position:relative;z-index:12;padding:12px max(24px,calc((100% - 820px)/2)) calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(247,248,250,.92) 24%)}.compose-box{min-height:58px;display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:end;padding:7px;border:1px solid rgba(60,60,67,.1);border-radius:29px;background:rgba(255,255,255,.9);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:0 12px 36px rgba(0,0,0,.08);transition:box-shadow 160ms ease}.compose-box:focus-within{box-shadow:var(--focus),0 12px 36px rgba(0,0,0,.08)}textarea{width:100%;min-height:42px;max-height:120px;resize:none;border:0;outline:0;background:transparent;padding:10px 12px;color:var(--ink);font-size:16px;line-height:1.4}textarea::placeholder{color:var(--faint)}.send{width:44px;height:44px;border:0;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;transition:transform 100ms ease-out,background 160ms ease,opacity 160ms ease}.send:active{transform:scale(.9)}.send:disabled{opacity:.4}.send svg{width:19px}.compose-note{text-align:center;margin-top:6px;color:var(--faint);font-size:9px}
    @media(hover:hover){.library-item:hover,.new-chat:hover{background:#fff}.suggestion:hover{background:#fff}.send:hover{background:var(--blue-deep)}}
    @media(max-width:719px){
      .app-shell{display:block}.sidebar{position:fixed;inset:0 auto 0 0;width:min(88vw,360px);border-right:0;box-shadow:var(--shadow);transform:translate3d(-104%,0,0);visibility:hidden;will-change:transform}.sidebar.open{visibility:visible}.close-drawer{display:grid;background:rgba(118,118,128,.1)}
      .drawer-backdrop{display:block;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity 180ms ease,visibility 180ms}.drawer-backdrop.show{opacity:1;visibility:visible}
      .workspace{height:100dvh;background:radial-gradient(circle at 50% 62%,rgba(177,220,255,.72),rgba(247,248,250,0) 38%),var(--canvas)}.topbar{min-height:68px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}.menu-btn{display:grid;background:rgba(255,255,255,.68)}.top-title strong{font-size:14px}.top-reset{display:grid;background:rgba(255,255,255,.68)}
      .chat-messages{padding:20px 16px 26px}.welcome{padding:30px 8px 80px}.welcome-mark{width:48px;height:48px;border-radius:16px;margin-bottom:18px}.welcome h1{font-size:34px}.welcome p{font-size:13px;line-height:1.6}.suggestions{display:none}.user-bubble{max-width:88%}.assistant-answer{font-size:14px;line-height:1.68}
      .composer-wrap{padding:10px 14px calc(12px + env(safe-area-inset-bottom))}.compose-box{min-height:56px;border-radius:28px}.compose-note{display:none}
    }
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:opacity 140ms ease!important}.sidebar{transform:none!important}.sidebar:not(.open){opacity:0!important}}
    @media(prefers-reduced-transparency:reduce){.compose-box,.drawer-backdrop{backdrop-filter:none;-webkit-backdrop-filter:none}.compose-box{background:#fff}.drawer-backdrop{background:rgba(0,0,0,.4)}}
    @media(prefers-contrast:more){:root{--line:rgba(0,0,0,.4)}.compose-box,.source{border:1px solid var(--line)}.library-item:focus-visible{outline:2px solid #000}}
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="libraryDrawer" aria-label="资料库" aria-hidden="false">
      <div class="sidebar-head" id="drawerDragArea">
        <div class="mark">传</div><div class="brand"><strong>中传海南一站通</strong><span>学生共建 · 入学资料与经验</span></div>
        <button class="icon-btn close-drawer" id="closeDrawer" aria-label="关闭资料库"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="sidebar-actions">
        <button class="new-chat" id="newChat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/><path d="M12 7v8M8 11h8"/></svg>发起新对话</button>
        <div class="library-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="librarySearch" type="search" placeholder="搜索资料或问题" autocomplete="off" aria-label="搜索资料库"><button class="clear-search" id="clearSearch" aria-label="清空搜索">×</button></div>
      </div>
      <div class="library-scroll"><div class="library-label"><span>资料库</span><span class="library-count" id="libraryCount">读取中…</span></div><div class="library-list" id="libraryContent"><div class="empty-library">资料正在整理中…</div></div></div>
      <div class="sidebar-foot"><div class="library-status"><span class="status-dot"></span><span id="sidebarStatus">连接知识库中…</span></div><div class="disclaimer" id="disclaimer">学生自建资料库，具体安排请以学校最新通知为准。</div></div>
    </aside>
    <div class="drawer-backdrop" id="drawerBackdrop" aria-hidden="true"></div>

    <main class="workspace">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="openDrawer" aria-label="打开资料库" aria-expanded="false" aria-controls="libraryDrawer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <div class="top-title"><strong>海南新生 Copilot</strong><span id="chatStatus">连接知识库中…</span></div>
        <button class="icon-btn top-reset" id="resetChat" aria-label="发起新对话" title="新对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
      </header>
      <section class="chat-messages" id="chatMessages" aria-live="polite"></section>
      <div class="composer-wrap"><div class="compose-box"><textarea id="chatInput" rows="1" maxlength="500" placeholder="试着问：开学报到要带什么？" aria-label="向新生助手提问"></textarea><button class="send" id="sendChat" aria-label="发送示例问题：开学报到要带什么？"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button></div><div class="compose-note">输入为空时可直接发送示例 · 重要事项请向老师或对应部门确认</div></div>
    </main>
  </div>

  <script>
    const $=s=>document.querySelector(s);
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const safeUrl=u=>/^https?:\/\//i.test(u)||u.startsWith('/files/')?u:'#';
    const fmtSize=n=>n>=1024?`${(n/1024).toFixed(n>=10240?0:1)} MB`:`${Math.round(n)} KB`;
    const iconLabel={pdf:'PDF',word:'DOC',excel:'XLS',image:'IMG',link:'↗'};
    const authorityName={official_policy:'学校正式政策',official_guidance:'学校办事材料',official_web:'学校官网',public_web:'公开网络',peer_experience:'往届学生经验',unverified:'待核实资料'};
    let library={files:[],links:[],questions:[],counts:{}};let sessionId=null;let busy=false;let progressTimer=null;
    const guidedQuestions=['开学报到要带什么？','宿舍是几人间？','怎么选课和退课？','学校有哪些社团？','有保研机会吗？','陵水天气需要准备什么衣服？','校园摆渡车怎么坐？','快递地址怎么填？'];let guidedIndex=0;
    const mobileDrawer=matchMedia('(max-width:719px)');const reducedMotion=matchMedia('(prefers-reduced-motion:reduce)');let drawerFrame=0;let drawerDrag=null;

    function welcome(){return `<div class="welcome" id="welcomeState"><div class="welcome-mark">✦</div><h1>嗨，我们从哪开始？</h1><p>可以直接问我，也可以从左侧资料库查文件。我会说明答案来自哪里，以及还有哪些地方需要确认。</p><div class="suggestions"><button class="suggestion">开学报到要带什么？</button><button class="suggestion">宿舍是几人间？</button><button class="suggestion">有保研机会吗？</button></div></div>`}
    function bindSuggestions(){document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{$('#chatInput').value=b.textContent;ask()})}
    function guidedQuestion(){return guidedQuestions[guidedIndex%guidedQuestions.length]}
    function updateSendLabel(){const typed=$('#chatInput').value.trim();$('#sendChat').setAttribute('aria-label',typed?'发送问题':`发送示例问题：${guidedQuestion()}`)}
    function updateInputGuide(advance=false){if(advance)guidedIndex=(guidedIndex+1)%guidedQuestions.length;$('#chatInput').placeholder=`试着问：${guidedQuestion()}`;updateSendLabel()}

    async function loadLibrary(){try{const r=await fetch('/api/library');if(!r.ok)throw new Error('library_failed');library=await r.json();$('#disclaimer').textContent=library.disclaimer;renderLibrary()}catch(e){$('#libraryContent').innerHTML='<div class="empty-library">资料库暂时没有加载出来。<br>可以先直接问问 Copilot。</div>';$('#libraryCount').textContent='待恢复'}}
    function itemBlob(x){return [x.name,x.title,x.description,x.question,x.answer,x.category,...(x.tags||[])].filter(Boolean).join(' ').toLowerCase()}
    function resourceItem(item,isLink=false){const type=isLink?'link':item.type;const title=isLink?item.title:item.name;const meta=isLink?(item.description||'常用网站'):`${fmtSize(item.size_kb)}${item.pinned?' · 置顶':''}`;return `<a class="library-item" href="${esc(safeUrl(item.url))}" target="_blank" rel="noreferrer"><span class="item-icon ${esc(type)}">${iconLabel[type]||'FILE'}</span><span class="item-copy"><span class="item-title">${esc(title)}</span><span class="item-meta">${esc(meta)}</span></span></a>`}
    function questionItem(x){return `<button class="library-item question-item" data-question="${esc(x.question)}"><span class="item-icon qa">?</span><span class="item-copy"><span class="item-title">${esc(x.question)}</span><span class="item-meta">${esc(x.category||'学生问答')}</span></span></button>`}
    function renderLibrary(){const q=$('#librarySearch').value.trim().toLowerCase();$('#clearSearch').style.display=q?'block':'none';const files=library.files.filter(x=>!q||itemBlob(x).includes(q));const links=library.links.filter(x=>!q||itemBlob(x).includes(q));const questions=library.questions.filter(x=>q&&itemBlob(x).includes(q)).slice(0,12);const resources=[...files.map(x=>resourceItem(x)),...links.map(x=>resourceItem(x,true))];let html=resources.join('');if(questions.length)html+=`<div class="library-label"><span>相关问答</span><span>${questions.length}</span></div>${questions.map(questionItem).join('')}`;$('#libraryContent').innerHTML=html||'<div class="empty-library">没有找到对应资料。<br>可以直接在右侧问我。</div>';$('#libraryCount').textContent=q?`${resources.length+questions.length} 项`:`${library.counts.files+library.counts.links} 项`;document.querySelectorAll('.question-item').forEach(b=>b.onclick=()=>{$('#chatInput').value=b.dataset.question;closeDrawer();ask()})}

    function drawerX(){const t=getComputedStyle($('#libraryDrawer')).transform;if(!t||t==='none')return 0;const v=t.match(/matrix(?:3d)?\((.+)\)/)?.[1].split(',').map(Number)||[];return v.length===16?v[12]:(v[4]||0)}
    function setDrawerX(x){const drawer=$('#libraryDrawer');drawer.style.transform=`translate3d(${x}px,0,0)`;const progress=1-Math.min(1,Math.abs(Math.min(0,x))/drawer.offsetWidth);$('#drawerBackdrop').style.opacity=String(progress)}
    function animateDrawer(target,initialVelocity=0,done=()=>{}){cancelAnimationFrame(drawerFrame);let x=drawerX();let v=initialVelocity;let last=performance.now();if(reducedMotion.matches){setDrawerX(target);done();return}const step=now=>{const dt=Math.min((now-last)/1000,.032);last=now;const force=-430*(x-target)-42*v;v+=force*dt;x+=v*dt;setDrawerX(x);if(Math.abs(x-target)<.5&&Math.abs(v)<8){setDrawerX(target);done();return}drawerFrame=requestAnimationFrame(step)};drawerFrame=requestAnimationFrame(step)}
    function openDrawer(){if(!mobileDrawer.matches)return;const drawer=$('#libraryDrawer');drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');drawer.setAttribute('aria-modal','true');drawer.setAttribute('role','dialog');$('#drawerBackdrop').classList.add('show');$('#openDrawer').setAttribute('aria-expanded','true');document.body.style.overflow='hidden';setDrawerX(-drawer.offsetWidth);animateDrawer(0);setTimeout(()=>$('#librarySearch').focus(),reducedMotion.matches?0:260)}
    function finishDrawerClose(){const drawer=$('#libraryDrawer');drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');drawer.style.transform='';$('#drawerBackdrop').classList.remove('show');$('#drawerBackdrop').style.opacity='';$('#openDrawer').setAttribute('aria-expanded','false');document.body.style.overflow='';$('#openDrawer').focus()}
    function closeDrawer(initialVelocity=0){if(!mobileDrawer.matches||!$('#libraryDrawer').classList.contains('open'))return;animateDrawer(-$('#libraryDrawer').offsetWidth,Math.min(0,initialVelocity),finishDrawerClose)}
    function rubberband(distance,dimension,constant=.4){return(distance*dimension*constant)/(dimension+constant*Math.abs(distance))}
    function project(velocity,deceleration=.99){return(velocity/1000)*deceleration/(1-deceleration)}
    function startDrawerDrag(e){if(!mobileDrawer.matches||!$('#libraryDrawer').classList.contains('open')||e.target.closest('button,input'))return;cancelAnimationFrame(drawerFrame);e.currentTarget.setPointerCapture(e.pointerId);drawerDrag={id:e.pointerId,startPointer:e.clientX,startDrawer:drawerX(),history:[{x:e.clientX,t:performance.now()}]}}
    function moveDrawerDrag(e){if(!drawerDrag||e.pointerId!==drawerDrag.id)return;const raw=drawerDrag.startDrawer+e.clientX-drawerDrag.startPointer;const x=raw>0?rubberband(raw,$('#libraryDrawer').offsetWidth):Math.max(-$('#libraryDrawer').offsetWidth,raw);setDrawerX(x);const now=performance.now();drawerDrag.history.push({x:e.clientX,t:now});drawerDrag.history=drawerDrag.history.filter(p=>now-p.t<90)}
    function endDrawerDrag(e){if(!drawerDrag||e.pointerId!==drawerDrag.id)return;const first=drawerDrag.history[0]||{x:e.clientX,t:performance.now()};const velocity=(e.clientX-first.x)/Math.max(16,performance.now()-first.t)*1000;const projected=drawerX()+project(velocity);drawerDrag=null;if(projected<-$('#libraryDrawer').offsetWidth*.34||velocity<-650)closeDrawer(velocity);else animateDrawer(0,velocity)}

    async function health(){try{const d=await fetch('/api/health').then(r=>r.json());const model=d.composer?.mode==='model'?'大模型已连接':'安全回答模式';const web=d.composer?.web_retrieval?.mode==='registry_plus_discovery'?' · 网页搜索已启用':'';$('#chatStatus').textContent=`${model}${web}`;$('#sidebarStatus').textContent=model}catch(e){$('#chatStatus').textContent='知识库连接待恢复';$('#sidebarStatus').textContent='连接待恢复'}}
    function addUser(q){$('#welcomeState')?.remove();$('#chatMessages').insertAdjacentHTML('beforeend',`<div class="chat-message user"><div class="user-bubble">${esc(q)}</div></div>`);scrollChat()}
    function typing(message){$('#typing')?.remove();if(message){$('#chatMessages').insertAdjacentHTML('beforeend',`<div class="assistant-progress" id="typing" role="status"><span class="progress-spinner" aria-hidden="true"></span><span>${esc(message)}</span></div>`);scrollChat()}}
    function sourceCard(x){const origin=x.retrieval_origin==='autonomous_search'?' · 本轮网页搜索':x.retrieval_origin==='verified_web_snapshot'?' · 已核验网页快照':x.retrieval_origin==='live_web'?' · 本轮读取':'';return `<div class="source"><div class="source-title">${esc(x.title)}</div><div class="source-meta">${esc(authorityName[x.authority_tier]||x.authority_tier||'参考资料')}${origin}${x.page_number?` · 第 ${x.page_number} 页`:''}</div><a href="${esc(safeUrl(x.source_url||'#'))}" target="_blank" rel="noreferrer">查看原始来源 ↗</a></div>`}
    function addAssistant(d){typing(false);const sources=d.sources||d.evidence||[];const evidence=sources.length?`<details class="sources"><summary>参考来源（${sources.length}）</summary>${sources.map(sourceCard).join('')}</details>`:'';$('#chatMessages').insertAdjacentHTML('beforeend',`<div class="chat-message assistant"><div class="message-label">海南新生 Copilot</div><div class="assistant-answer">${esc(d.display_answer||d.answer||'这次没有生成有效回答。')}</div>${evidence}</div>`);scrollChat()}
    function scrollChat(){const box=$('#chatMessages');requestAnimationFrame(()=>box.scrollTo({top:box.scrollHeight,behavior:reducedMotion.matches?'auto':'smooth'}))}
    async function ask(){const input=$('#chatInput');const q=input.value.trim()||guidedQuestion();if(!q||busy)return;busy=true;input.value='';input.style.height='auto';updateInputGuide(true);$('#sendChat').disabled=true;addUser(q);typing('正在翻阅往届师兄师姐留下来的材料…');clearTimeout(progressTimer);progressTimer=setTimeout(()=>{if(busy)typing('正在整理回答中…')},700);try{const r=await fetch('/api/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({query:q,session_id:sessionId,profile:{cohort:'2026',student_level:'undergraduate'}})});const d=await r.json();if(!r.ok)throw new Error(d.error||'request_failed');sessionId=d.session_id;addAssistant(d)}catch(e){addAssistant({answer:'刚刚没有连上回答服务。你可以稍后再试，重要问题也可以先问师哥师姐或老师。'})}finally{clearTimeout(progressTimer);progressTimer=null;busy=false;$('#sendChat').disabled=false;updateSendLabel();input.focus()}}
    async function resetChat(){if(sessionId)await fetch('/api/session/reset',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({session_id:sessionId})}).catch(()=>{});sessionId=null;$('#chatMessages').innerHTML=welcome();bindSuggestions();closeDrawer();$('#chatInput').focus()}
    function syncDrawerMode(){cancelAnimationFrame(drawerFrame);drawerDrag=null;const drawer=$('#libraryDrawer');drawer.style.transform='';$('#drawerBackdrop').style.opacity='';if(mobileDrawer.matches){drawer.classList.remove('open');drawer.setAttribute('aria-hidden','true');drawer.setAttribute('role','dialog');drawer.setAttribute('aria-modal','true')}else{drawer.classList.add('open');drawer.setAttribute('aria-hidden','false');drawer.setAttribute('role','complementary');drawer.removeAttribute('aria-modal');$('#drawerBackdrop').classList.remove('show');$('#openDrawer').setAttribute('aria-expanded','false');document.body.style.overflow=''}}

    $('#openDrawer').onclick=openDrawer;$('#closeDrawer').onclick=()=>closeDrawer();$('#drawerBackdrop').onclick=()=>closeDrawer();$('#newChat').onclick=resetChat;$('#resetChat').onclick=resetChat;$('#librarySearch').oninput=renderLibrary;$('#clearSearch').onclick=()=>{$('#librarySearch').value='';renderLibrary();$('#librarySearch').focus()};$('#sendChat').onclick=ask;$('#chatInput').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,120)+'px';updateSendLabel()};$('#chatInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}};$('#drawerDragArea').addEventListener('pointerdown',startDrawerDrag);$('#drawerDragArea').addEventListener('pointermove',moveDrawerDrag);$('#drawerDragArea').addEventListener('pointerup',endDrawerDrag);$('#drawerDragArea').addEventListener('pointercancel',endDrawerDrag);mobileDrawer.addEventListener('change',syncDrawerMode);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
    $('#chatMessages').innerHTML=welcome();bindSuggestions();updateInputGuide();syncDrawerMode();loadLibrary();health();
  </script>
</body>

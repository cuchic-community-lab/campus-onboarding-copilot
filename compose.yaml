name: hic-copilot

services:
  app:
    build:
      context: .
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - deploy/.env.production
    environment:
      CAMPUS_ENVIRONMENT: production
      CAMPUS_TRACE_DB_PATH: /app/data/runtime/rag_traces.db
    expose:
      - "8000"
    volumes:
      - hic_runtime:/app/data/runtime
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; data=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)); raise SystemExit(0 if data.get('status') == 'ok' and data.get('database_ready') else 1)"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - backend

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CAMPUS_DOMAIN: ${CAMPUS_DOMAIN:?Set CAMPUS_DOMAIN in deploy/.env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend

networks:
  backend:

volumes:
  hic_runtime:
  caddy_data:
  caddy_config:
